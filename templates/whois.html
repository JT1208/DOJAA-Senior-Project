{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>WHOIS Lookup</h2>
  <p class="text-muted">Look up domain registration information.</p>

  <div class="input-group mb-3" style="max-width: 500px;">
    <input type="text" id="domainInput" class="form-control" placeholder="  ">
    <button class="btn btn-primary" id="lookupBtn">Lookup</button>
  </div>

  <div id="results"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  document.getElementById("lookupBtn").addEventListener("click", function () {
    const domain = document.getElementById("domainInput").value.trim();
    if (!domain) return;

    document.getElementById("results").innerHTML = "<p>Loading...</p>";

    fetch(`/api/whois?domain=${domain}`)
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          document.getElementById("results").innerHTML = `<p class="text-danger">${data.error}</p>`;
          return;
        }

        let html = `<h5>Results for <strong>${data.domain}</strong></h5>
          <table class="table table-bordered table-striped">
          <thead class="table-dark"><tr><th>Field</th><th>Value</th></tr></thead><tbody>
          <tr><td><strong>Registrar</strong></td><td>${data.registrar}</td></tr>
          <tr><td><strong>Creation Date</strong></td><td>${data.creation_date}</td></tr>
          <tr><td><strong>Expiration Date</strong></td><td>${data.expiration_date}</td></tr>
          <tr><td><strong>Name Servers</strong></td><td>${data.name_servers}</td></tr>
          </tbody></table>`;

        document.getElementById("results").innerHTML = html;
      })
      .catch(() => {
        document.getElementById("results").innerHTML = "<p class='text-danger'>Request failed.</p>";
      });
  });
});
</script>
{% endblock %}
