<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · DOJAA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { width: 100%; max-width: 420px; padding: var(--space-6); }
    .login-card__logo { display: flex; align-items: center; justify-content: center; margin-bottom: var(--space-4); }
    .login-card__logo img { max-height: 56px; }
    .login-card__title { text-align: center; font-size: var(--text-lg); margin-bottom: var(--space-5); }
    .login-card .form-stack input { width: 100%; }
    .login-card .btn { width: 100%; justify-content: center; }
    .login-footnote { color: var(--ink-muted); font-size: var(--text-xs); text-align: center; margin-top: var(--space-4); }
  </style>
</head>
<body>
  <div class="card login-card">
    <div class="login-card__logo">
      <img src="{{ url_for('static', filename='dojaa-logo.png') }}" alt="DOJAA" />
    </div>
    <div class="login-card__title">Digital Observatory for Joint Asset Analysis</div>

    {% if error %}
      <div class="alert alert--danger" role="alert" style="margin-bottom: var(--space-4);">
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.login') }}" class="form-stack" novalidate>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username"
               placeholder="you@{{ email_domain }}" />
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn--primary">Sign in</button>
    </form>

    <p class="login-footnote">Authorised {{ email_domain }} accounts only.</p>
  </div>
</body>
</html>
