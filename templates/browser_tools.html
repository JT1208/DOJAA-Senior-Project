{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Browser Tools</h2>
  <p class="text-muted">Check HTTP security headers for any website.</p>

  <div class="input-group mb-3" style="max-width: 500px;">
    <input type="text" id="urlInput" class="form-control" placeholder="  ">
    <button class="btn btn-primary" id="checkBtn">Check</button>
  </div>

  <div id="results"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  document.getElementById("checkBtn").addEventListener("click", function () {
    const url = document.getElementById("urlInput").value.trim();
    if (!url) return;

    document.getElementById("results").innerHTML = "<p>Loading...</p>";

    fetch(`/api/browser_tools?url=${encodeURIComponent(url)}`)
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          document.getElementById("results").innerHTML = `<p class="text-danger">${data.error}</p>`;
          return;
        }

        let html = `<h5>Results for <strong>${data.url}</strong></h5>
          <table class="table table-bordered table-striped">
          <thead class="table-dark"><tr><th>Security Header</th><th>Status</th><th>Value</th></tr></thead><tbody>`;

        for (const [header, info] of Object.entries(data.results)) {
          const badge = info.present
            ? `<span class="badge bg-success">Present</span>`
            : `<span class="badge bg-danger">Missing</span>`;
          html += `<tr><td><strong>${header}</strong></td><td>${badge}</td><td><small>${info.value}</small></td></tr>`;
        }

        html += "</tbody></table>";
        document.getElementById("results").innerHTML = html;
      })
      .catch(() => {
        document.getElementById("results").innerHTML = "<p class='text-danger'>Request failed.</p>";
      });
  });
});
</script>
{% endblock %}
