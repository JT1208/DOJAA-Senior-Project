{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">Attack Surface Intelligence Graph</h2>

<div class="card shadow-sm">
  <div class="card-body">
    <div id="graph" style="height:900px; border:1px solid #ddd;"></div>
    <pre id="debug" style="font-size:12px; color:#666;"></pre>
  </div>
</div>

<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const container = document.getElementById("graph");
  const debug = document.getElementById("debug");
  const log = (m) => debug.textContent += m + "\n";

  const raw = {{ shodan | tojson }};

  if (!raw || raw.length === 0) {
    container.innerHTML = "No data";
    return;
  }

  // =========================
  // FULL DATA PRESERVED
  // =========================
  const assets = Array.from(
    new Map(raw.filter(a => a?.ip).map(a => [a.ip, a])).values()
  );

  log("Total assets: " + assets.length);

  const nodes = [];
  const edges = [];

  // =========================
  // ROOT NODE
  // =========================
  nodes.push({
    id: "internet",
    label: "EXTERNAL ATTACK SURFACE",
    shape: "box",
    color: "#1f2d3d",
    font: { color: "white", size: 20 },
    margin: 15
  });

  // =========================
  // SERVICE HUBS (IMPORTANT STRUCTURE)
  // =========================
  const hubs = {
    SSH: { color: "#c0392b" },
    WEB: { color: "#2980b9" },
    OTHER: { color: "#7f8c8d" }
  };

  for (const h in hubs) {
    nodes.push({
      id: h,
      label: h + " SERVICES",
      shape: "box",
      color: hubs[h].color,
      font: { color: "white", size: 16 },
      margin: 12
    });

    edges.push({ from: "internet", to: h, width: 2 });
  }

  // =========================
  // CLASSIFICATION
  // =========================
  function classify(a) {
    if (a.port === 22) return "SSH";
    if (a.port === 80 || a.port === 443) return "WEB";
    return "OTHER";
  }

  function riskColor(r) {
    if (r >= 70) return "#e74c3c";
    if (r >= 30) return "#f1c40f";
    return "#2ecc71";
  }

  // =========================
  // HOST NODES (NO DATA LOSS)
  // =========================
  for (const a of assets) {

    const ip = a.ip;
    const group = classify(a);
    const risk = a.risk_score || 0;

    nodes.push({
      id: ip,
      label: ip,
      shape: "dot",
      size: 14,
      color: {
        background: riskColor(risk),
        border: "#2c3e50"
      },
      font: { size: 12 },

      // 🔥 ANALYST VALUE (THIS WAS MISSING BEFORE)
      title: `
        <b>IP:</b> ${ip}<br>
        <b>Port:</b> ${a.port || "-"}<br>
        <b>Service:</b> ${a.service || "Unknown"}<br>
        <b>Risk:</b> ${risk}<br>
        <b>Provider:</b> ${a.provider || "-"}<br>
        <b>SSH:</b> ${a.ssh_exposed}<br>
        <b>HTTP:</b> ${a.http_exposed}<br>
        <b>HTTPS:</b> ${a.https_exposed}<br>
        <b>Banner:</b> ${(a.banner || "").slice(0, 120)}
      `
    });

    edges.push({
      from: group,
      to: ip,
      width: 1,
      color: "#bbb"
    });
  }

  // =========================
  // GRAPH DATA
  // =========================
  const data = {
    nodes: new vis.DataSet(nodes),
    edges: new vis.DataSet(edges)
  };

  // =========================
  // OPTIMIZED PHYSICS (BALANCED)
  // =========================
  const options = {
    layout: {
      improvedLayout: true
    },

    physics: {
      enabled: true,
      barnesHut: {
        gravitationalConstant: -8000,
        springLength: 160,
        springConstant: 0.03
      },
      stabilization: {
        iterations: 250
      }
    },

    nodes: {
      borderWidth: 2,
      shadow: true
    },

    edges: {
      arrows: "to",
      smooth: {
        type: "dynamic"
      },
      color: { color: "#aaa" }
    },

    interaction: {
      hover: true,
      tooltipDelay: 100,
      zoomView: true,
      dragView: true
    }
  };

  const network = new vis.Network(container, data, options);

  // =========================
  // AUTO FIT (CRITICAL UX FIX)
  // =========================
  network.once("stabilizationIterationsDone", function () {
    network.fit({
      animation: { duration: 800 }
    });

    log("Graph stabilized and fitted");
  });

});
</script>

{% endblock %}
