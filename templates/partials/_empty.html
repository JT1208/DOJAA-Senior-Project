<div class="empty-state">
  <div class="empty-state__icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
  </div>
  <div class="empty-state__title">{{ title or 'Nothing here yet' }}</div>
  {% if sub %}<p class="empty-state__sub">{{ sub }}</p>{% endif %}
  {% if cta_label and cta_href %}
    <p style="margin-top: var(--space-3);">
      <a class="btn btn--primary" href="{{ cta_href }}">{{ cta_label }}</a>
    </p>
  {% endif %}
</div>
