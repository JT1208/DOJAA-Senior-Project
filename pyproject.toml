[project]
name = "dojaa-senior-project"
version = "0.1.0"
description = "DOJAA — Digital Observatory for Joint Asset Analysis"
authors = [
    {name = "DOJAA team"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "flask (>=3.0,<4.0)",
    "requests (>=2.28,<3.0)",
    "cryptography (>=41.0)",
    "reportlab (>=4.0,<5.0)",
    "matplotlib (>=3.7,<4.0)",
    "jinja2 (>=3.1,<4.0)",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary (>=2.9,<3.0)",
]
dev = [
    "pytest (>=8.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
