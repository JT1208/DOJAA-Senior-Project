<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intelligence Console · DOJAA</title>
  <!-- Note: ES modules require HTTP. Serve with: python3 -m http.server 8080 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <!-- ===== App Header ===================================================== -->
  <header class="app-header">
    <div class="header-brand">
      <img src="dojaa-logo.png" alt="DOJAA" height="36" onerror="this.style.display='none'">
      <span class="brand-name">DOJAA</span>
    </div>

    <nav class="tab-nav" aria-label="Intelligence views">
      <button class="tab-btn" data-tab="hosts">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
        Hosts
      </button>
      <button class="tab-btn" data-tab="domains">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        Domains
      </button>
      <button class="tab-btn" data-tab="vulnerabilities">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Vulnerabilities
      </button>
      <button class="tab-btn" data-tab="certificates">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        Certificates
      </button>
      <button class="tab-btn" data-tab="intelligence">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        Intelligence
      </button>
    </nav>

    <div class="header-right">
      <!-- Alert icon -->
      <div class="header-alert" id="header-alert" aria-hidden="true">
        <button type="button" class="header-alert-btn" id="alert-icon-btn" aria-label="Alerts">
          <svg class="alert-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="alert-badge" id="alert-badge">0</span>
        </button>
        <div class="header-alert-dropdown" id="alert-dropdown" role="dialog" aria-label="Send alert">
          <div class="alert-dropdown-head">
            <strong>Active Threats Detected</strong>
            <p class="alert-dropdown-desc">Send an alert email to your team.</p>
          </div>
          <form id="alert-form" class="alert-form-inline" novalidate>
            <div class="form-group">
              <label for="alert-to">To</label>
              <input type="email" id="alert-to" name="to" placeholder="email@example.com" required>
              <span class="error-msg" id="alert-to-error"></span>
            </div>
            <div class="form-group">
              <label for="alert-subject">Subject</label>
              <input type="text" id="alert-subject" name="subject" placeholder="e.g. Critical threat detected" required>
            </div>
            <div class="form-group">
              <label for="alert-message">Message</label>
              <textarea id="alert-message" name="message" rows="3" placeholder="Alert details…" required></textarea>
            </div>
            <div class="alert-actions">
              <button type="submit" id="alert-submit" class="btn-send">Send</button>
              <span class="alert-status" id="alert-status" aria-live="polite"></span>
            </div>
          </form>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="header-actions">
        <button type="button" class="header-btn header-btn-secondary" id="header-rescan-btn">Rescan</button>
        <button type="button" class="header-btn header-btn-primary" id="header-report-btn">Report</button>
      </div>

      <!-- User -->
      <span class="header-user">
        <span id="user-email"></span>
        <a href="login.html" class="signout-link">Sign out</a>
      </span>
    </div>
  </header>

  <!-- ===== App Body ======================================================= -->
  <div class="app-body">

    <!-- Summary bar -->
    <div class="summary-bar" id="summary-bar" aria-label="Intelligence summary"></div>

    <!-- Tab panels: each view mounts into its own panel -->
    <div class="tab-container">
      <div class="tab-panel" data-tab="hosts"></div>
      <div class="tab-panel hidden" data-tab="domains"></div>
      <div class="tab-panel hidden" data-tab="vulnerabilities"></div>
      <div class="tab-panel hidden" data-tab="certificates"></div>
      <div class="tab-panel hidden" data-tab="intelligence"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
